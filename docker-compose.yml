services:
  couchdb:
    image: couchdb:3.3
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-change-me}
    ports:
      - "5984:5984"   # Fauxton: http://localhost:5984/_utils
    volumes:
      - couch-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5984/_up"]
      interval: 5s
      retries: 15

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_DB: tasks
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-change-me}
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couch-data:
