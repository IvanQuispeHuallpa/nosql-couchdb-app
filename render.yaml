services:
  # Base de datos NoSQL: Apache CouchDB oficial, desplegada como imagen Docker.
  # El plan gratuito de Render no tiene disco persistente: los datos se pierden al reiniciar
  # (la app recrea la base y el índice sola). Para persistencia, usa un plan de pago con disco
  # montado en /opt/couchdb/data.
  - type: web
    name: couchdb
    runtime: image
    image:
      url: docker.io/library/couchdb:3.3
    plan: free
    healthCheckPath: /_up
    envVars:
      - key: PORT
        value: "5984"
      - key: COUCHDB_USER
        value: admin
      - key: COUCHDB_PASSWORD
        generateValue: true

  # Aplicación Flask (se construye con el Dockerfile del repositorio).
  - type: web
    name: nosql-couchdb-app
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: false # los despliegues los dispara GitHub Actions (deploy hook)
    envVars:
      # URL pública de CouchDB, p. ej. https://couchdb-xxxx.onrender.com (protegida con usuario y
      # contraseña). No se usa la red privada (fromService/hostport) porque en el plan gratuito un
      # servicio no recibe tráfico privado: la app se quedaba esperando. Render pide este valor
      # al crear el Blueprint y lo conserva en las sincronizaciones siguientes.
      - key: COUCHDB_URL
        sync: false
      - key: COUCHDB_USER
        fromService:
          type: web
          name: couchdb
          envVarKey: COUCHDB_USER
      - key: COUCHDB_PASSWORD
        fromService:
          type: web
          name: couchdb
          envVarKey: COUCHDB_PASSWORD
      - key: COUCHDB_DB
        value: tasks
